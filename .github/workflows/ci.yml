name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # plugins/live-share is committed so the repo works as a Codex plugin
      # marketplace; installs get whatever is on main, so it must match the source.
      - name: Committed plugin build is up to date
        run: |
          if [ -n "$(git status --porcelain -- plugins)" ]; then
            git status --short -- plugins
            echo "::error::plugins/live-share is out of date. Run \`pnpm build\` and commit the result."
            exit 1
          fi
      - name: Signal Worker bundles
        run: pnpm --filter @codex-live-share/signal deploy:dry-run
